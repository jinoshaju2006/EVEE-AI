name: Build EVEE AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare official EVEE launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          curl -fL https://raw.githubusercontent.com/jinoshaju2006/EVEE-AI/main/public/evee-app-icon.png -o android/app/src/main/res/drawable-nodpi/evee_app_icon.png
          curl -fL https://raw.githubusercontent.com/jinoshaju2006/EVEE-AI/main/public/evee-ai-avatar.png.png -o android/app/src/main/res/drawable-nodpi/evee_ai_avatar.png
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EVEE-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
